    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaIA | Professor/Responsável</title>
    <link rel="icon" type="image/png" href="../assets/logo-coati.png">
    <link rel="apple-touch-icon" href="../assets/logo-coati.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../config.js"></script>
    <!-- Proteção de rota: sem login → login; sem role de responsável → início.
         Repete ROLES_RESPONSAVEL do comum.js de propósito (roda ANTES do render, e
         o comum.js só carrega no fim do <body>) — mudou lá, mude aqui. É só
         CONVENIÊNCIA: o controle REAL é o backend, pela role do token em /responsavel/painel. -->
    <script>
        const usuario = JSON.parse(sessionStorage.getItem('kaia_usuario')
                                || localStorage.getItem('kaia_usuario') || 'null');
        if (!usuario) window.location.href = 'login.html';
        else if (!['professor', 'coordenador', 'pai'].includes((usuario.role || '').toLowerCase()))
            window.location.href = 'materias.html';
    </script>
</head>

<!-- data-rail: o comum.js injeta a barra lateral estática (com a saudação no rodapé) -->
<body data-rail>

    <main class="conteudo">

        <!-- ============ VISTA TURMA (padrão) ============ -->
        <section id="vista-turma">

            <!-- Painel por role (professor / coordenador / pai).
                 Professor com PAINEL_DEMO: monta de ALUNOS_DEMO, sem rede.
                 Demais casos: GET /responsavel/painel, como sempre. -->
            <section id="painel-role">
                <h2 id="painel-titulo">Carregando…</h2>
                <p id="painel-sub" class="painel-sub"></p>
                <div id="painel-filtro"></div>    <!-- seletor de turma (recorte primário) -->
                <div id="painel-risco"></div>     <!-- "precisam de você agora" -->
                <div id="painel-visao"></div>     <!-- contagens por status + rosca -->
                <div id="painel-graficos"></div>  <!-- desempenho da turma -->
                <!-- Tabela por ÚLTIMO: em turma grande ela é longa, e empurraria a
                     leitura geral para baixo da dobra. Quem precisa de você (faixa
                     de risco) e o panorama vêm primeiro; a lista é o detalhamento. -->
                <div id="painel-tabela"></div>
            </section>

            <!-- Busca avulsa por e-mail: escondida enquanto PAINEL_DEMO estiver
                 ligado (o clique no nome já leva ao mesmo relatório, e esta é a
                 rota sem escopo fino — ver a dívida em app.py). -->
            <div class="busca" id="bloco-busca">
                <input id="email" type="email" placeholder="E-mail do aluno" autocomplete="off">
                <button type="button" onclick="carregar()">Ver estatísticas</button>
            </div>

            <div id="status"></div>

            <div class="grafico container-grafico" id="bloco-hobbies">
                <h3>Estatísticas de Hobbies dos Usuários</h3>
                <canvas id="meuGraficoKaIA"></canvas>
            </div>

        </section>

        <!-- ============ VISTA ALUNO (relatório individual) ============ -->
        <!-- Os 5 cards, os 2 gráficos de série diária e a linha de hobbies são os
             MESMOS que a busca por e-mail já usava — só mudaram de lugar. As duas
             entradas (clique no nome / busca) preenchem este bloco. -->
        <section id="vista-aluno" hidden>
            <button type="button" class="voltar-turma" id="voltar-turma">
                ← Voltar para <span id="voltar-turma-rot">a turma</span>
            </button>

            <div class="aluno-cabecalho">
                <h2 id="aluno-nome">–</h2>
                <span id="aluno-status"></span>
            </div>
            <p id="aluno-sub" class="painel-sub"></p>

            <div id="painel">
                <div class="cards">
                    <div class="card">
                        <label>Total de acertos</label>
                        <div class="v" id="m-acertos">–</div>
                    </div>
                    <div class="card">
                        <label>Dias com estudo</label>
                        <div class="v" id="m-dias">–</div>
                    </div>
                    <div class="card">
                        <label>Sequência de dias</label>
                        <div class="v" id="m-seq">–</div>
                    </div>
                    <div class="card">
                        <label>Minutos estudados</label>
                        <div class="v" id="m-minutos">–</div>
                    </div>
                    <div class="card">
                        <label>Evolução de acertos</label>
                        <div class="v tag" id="m-tend-acertos">–</div>
                    </div>
                </div>

                <!-- Taxa de acerto semana a semana: só aparece quando a série traz
                     `acerto`. O backend hoje NÃO devolve esse campo (manda acertos
                     ABSOLUTOS por dia, no gráfico abaixo) — é mock-only. -->
                <div class="graf-card" id="bloco-evolucao" hidden>
                    <h4>Evolução da taxa de acerto (%)</h4>
                    <div class="graf-wrap"><canvas id="g-evolucao"></canvas></div>
                </div>

                <!-- Mesma moldura do gráfico novo: sem altura fixa estes dois
                     esticavam por centenas de px e engoliam o relatório. -->
                <div class="graf-linha">
                    <div class="graf-card">
                        <h4>Acertos por dia (quanto mais alto, melhor)</h4>
                        <div class="graf-wrap"><canvas id="g-acertos"></canvas></div>
                    </div>
                    <div class="graf-card">
                        <h4>Minutos estudados por dia (quanto mais alto, melhor)</h4>
                        <div class="graf-wrap"><canvas id="g-minutos"></canvas></div>
                    </div>
                </div>

                <p class="hobbies" id="hobbies"></p>
            </div>
        </section>

    </main>

        const SEMANA_DEMO = 8;
        const PROFESSOR_DEMO = { nome: 'Prof. demonstração', materia: 'Matemática', escola: 'Escola demonstração' };

        // RITMO DE ESTUDO, não leitura de atenção: o painel de professor/responsável
        // mostra esforço, progresso e constância, e nada que saia de modelo de atenção.
        // Motivo: a leitura de foco da KaIA não tem validação em dado real, e um "% de
        // atenção" por aluno na mão de um adulto vira cobrança em casa (o público inclui
        // TEA/TDAH). A leitura de foco continua existindo para decidir apoio DENTRO do
        // estudo, para o próprio aluno — não sai em relatório de adulto.
        // Cortes: MESMOS do backend (app.py:_status_ritmo) — <60 min na semana pouco
        // estudo, 60-179 irregular, >=180 constante. Mudou lá, mude aqui.
        const statusRitmo = (min) =>
            min == null ? null : min < 60 ? 'risco' : min < 180 ? 'atencao' : 'bem';

        // Lê um token de cor do :root — evita hex solto que envelhece à parte da paleta.
        const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

        // ---- Tratamento das linhas (Fase 4) --------------------------------
        // Sem glow/neon: a tela mostra crianças em risco e o olho deve ir ao dado; a
        // marca é calma. Acabamento = degradê, linha encorpada, ponto que cresce no hover.
        // Scriptable: degradê recalculado a cada layout, na ÁREA do gráfico — com
        // canvas.height na montagem pegava 150px default e o degradê parava no meio.
        const degrade = (rgbToken, topo = 0.3) => (ctx) => {
            const { chart } = ctx;
            const area = chart.chartArea;
            if (!area) return 'transparent';        // 1º passo do layout: sem área ainda
            const g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
            g.addColorStop(0, `rgba(${tok(rgbToken)}, ${topo})`);
            g.addColorStop(1, `rgba(${tok(rgbToken)}, 0)`);
            return g;
        };

            tension: .35,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBorderWidth: 2,
            pointBackgroundColor: tok('--card'),   // miolo claro: o ponto "recorta" a linha
            fill: true,
        };

        const EIXOS_LIMPOS = {

        const TREND = {
            melhorando: { txt: '↑ Melhorando', cls: 'bom' },
            piorando:   { txt: '↓ Piorando',   cls: 'ruim' },

        function aplicarTend(id, valor) {
            const info = TREND[valor] || TREND.sem_dados;
            const el = document.getElementById(id);
            el.textContent = info.txt;
            el.className = 'v tag ' + info.cls;
        }

        // Escapa antes de interpolar em innerHTML. Hoje os dados são de uma
        // constante local, mas o mesmo caminho vai receber payload do backend.
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // ========================================================
        //   RELATÓRIO INDIVIDUAL — fonte única para as duas entradas
        // ========================================================
        // Clique no nome (mock) e busca por e-mail (backend) preenchem ESTE bloco.
        // Cada entrada adapta seus dados para o formato abaixo; nada é duplicado.
        function preencherRelatorio(r) {
            $('aluno-nome').textContent = r.nome;
            $('aluno-sub').textContent  = r.sub || '';
            $('aluno-status').innerHTML = r.status ? badge(r.status) : '';

            $('m-acertos').textContent = r.resumo.total_acertos ?? '–';
            $('m-dias').textContent    = r.resumo.dias_com_dados ?? '–';
            $('m-seq').textContent     = r.resumo.sequencia_dias ?? 0;
            $('m-minutos').textContent = r.resumo.minutos ?? '–';
            aplicarTend('m-tend-acertos', r.resumo.tendencia_acertos);

            $('hobbies').textContent = r.hobbies?.length
                ? `Hobbies usados na personalização: ${r.hobbies.join(', ')}` : '';

            desenhar(r.serie.map(s => s.dia), r.serie.map(s => s.acertos), r.serie.map(s => s.minutos));
            desenharEvolucao(r.serie);
            $('painel').style.display = 'block';
        }

        // Taxa de acerto semana a semana. MOCK-ONLY: só desenha se a série traz
        // `acerto`. /responsavel/aluno devolve acertos ABSOLUTOS por dia (gráfico de
        // baixo), não a taxa — então na busca por e-mail o bloco fica escondido em
        // vez de inventar linha.
        let gEvolucao = null;
        function desenharEvolucao(serie) {
            gEvolucao?.destroy(); gEvolucao = null;
            const tem = serie.length > 0 && serie[0].acerto != null;
            $('bloco-evolucao').hidden = !tem;
            if (!tem) return;

            const cv = $('g-evolucao');
            gEvolucao = new Chart(cv, {
                type: 'line',
                data: {
                    labels: serie.map(s => s.dia),
                    datasets: [
                        { ...LINHA_BASE, label: 'Acerto',
                          data: serie.map(s => Math.round(s.acerto * 100)),
                          borderColor: tok('--acerto-tx'),
                          pointBorderColor: tok('--acerto-tx'),
                          backgroundColor: degrade('--vd-uniao-rgb', .35) },
                    ],
                },
                options: {
                    ...EIXOS_LIMPOS,
                    scales: { ...EIXOS_LIMPOS.scales,
                              y: { ...EIXOS_LIMPOS.scales.y, suggestedMax: 100 } },
                },
            });
        }

        async function carregar() {
            const email  = document.getElementById('email').value.trim();
            const status = document.getElementById('status');

            if (!email) { status.textContent = 'Digite o e-mail do aluno.'; return; }
            status.textContent = 'Carregando…';
            document.getElementById('painel').style.display = 'none';

            try {
                const r = await apiFetch(`/responsavel/aluno?email=${encodeURIComponent(email)}`);
                const data = await r.json();

                if (!r.ok) { status.textContent = data.erro || 'Erro ao buscar o aluno.'; return; }
                if (!data.series.length) {
                    status.textContent = 'Aluno encontrado, mas ainda não há dados de estudo registrados.';
                    return;
                }

                status.textContent = data.demo
                    ? '⚠️ Modo demonstração: dados de exemplo (sem conexão com o banco nesta rede).'
                    : '';

                const _pronto = {
                    nome: data.aluno.email || email,
                    sub: `Busca por e-mail · ${data.resumo.dias_com_dados} dias com dados`,
                    status: statusRitmo(data.resumo.minutos),
                    hobbies: data.aluno.hobbies || [],
                    resumo: {
                        total_acertos: data.resumo.total_acertos,
                        dias_com_dados: data.resumo.dias_com_dados,
                        sequencia_dias: data.aluno.sequencia_dias_estudo ?? 0,
                        minutos: data.resumo.minutos,
                        tendencia_acertos: data.resumo.tendencia_acertos,
                    },
                    serie: data.series,                 // sem `acerto` → sem gráfico de taxa
                };
                _veioDaLista = false;
                mostrarVista('aluno');                  // antes de desenhar: canvas precisa de tamanho
                preencherRelatorio(_pronto);
            } catch (e) {
                status.textContent = 'Não foi possível conectar ao servidor (a API está rodando em :5000?).';
                console.error(e);
            }
        }

        function desenhar(labels, acertos, minutos) {
            const cvA = document.getElementById('g-acertos');
            gAcertos?.destroy();
            gAcertos = new Chart(cvA, {
                type: 'line',
                data: { labels, datasets: [{
                    ...LINHA_BASE, label: 'Acertos', data: acertos,
                    borderColor: tok('--acerto-tx'),
                    pointBorderColor: tok('--acerto-tx'),
                    backgroundColor: degrade('--vd-uniao-rgb', .35),
                }] },
                options: EIXOS_LIMPOS,
            });

            gMinutos?.destroy();
            gMinutos = new Chart(document.getElementById('g-minutos'), {
                type: 'bar',
                data: { labels, datasets: [{
                    label: 'Minutos', data: minutos,
                    backgroundColor: tok('--acerto-bg'),
                    borderColor: tok('--acerto-tx'), borderWidth: 1, borderRadius: 6,
                }] },
                options: EIXOS_LIMPOS,
            });
        }

        // Gráfico geral: hobbies de todos os usuários (Supabase via API)
        async function carregarGraficoHobbies() {
            try {
                const r = await apiFetch(`/api/dados-grafico`);
                const dados = await r.json();   // { labels: [...], valores: [...] }
                if (!dados.labels?.length) return;

                if (dados.demo) {
                    const h = document.querySelector('.container-grafico h3');
                    if (h) h.textContent += ' (dados de exemplo)';
                }

                gHobbies?.destroy();
                gHobbies = new Chart(document.getElementById('meuGraficoKaIA'), {
                    type: 'bar',
                    data: {
                        labels: dados.labels,
                        datasets: [{
                            label: 'Quantidade de Escolhas',
                            data: dados.valores,
                            backgroundColor: ['#f3d009', '#2d4ba5', '#57d979', '#c4a186'],
                            borderColor: '#1a2b4c',
                            borderWidth: 1,
                        }]
                    },
                    options: EIXOS,
                });
            } catch (erro) {
                console.error('Erro ao carregar dados para o gráfico:', erro);
            }
        }

        // ========================================================
        //   PAINEL POR ROLE — professor / coordenador / pai
        // ========================================================
        // `usuario` vem da guarda de rota no <head> (sessionStorage.kaia_usuario).
        const pct = (v) => (v == null ? '—' : `${Math.round(v * 100)}%`);

        // Ritmo por aluno (mesmos cortes do backend: <60 min pouco, 60-179 irregular, ≥180 constante)
        const STATUS_ROT = { bem: 'Constante', atencao: 'Irregular', risco: 'Pouco estudo' };
        const STATUS_COR = { bem: '#2f5d3a', atencao: '#8a6d1e', risco: '#8a3b3b' };
        const badge = (s) => s ? `<span class="status-badge status-${s}">${STATUS_ROT[s] || '—'}</span>` : '—';

        // Uma tabela simples a partir de [{rotulo, campo, fmt}] + as linhas.
        function tabela(colunas, linhas) {
            if (!linhas.length) return '<p class="painel-sub">Nenhum dado nesta semana.</p>';
            const th = colunas.map(c => `<th>${c.rotulo}</th>`).join('');
            const tr = linhas.map(l => '<tr>' + colunas
                .map(c => `<td>${c.fmt ? c.fmt(l[c.campo]) : (l[c.campo] ?? '—')}</td>`)
                .join('') + '</tr>').join('');
            return `<table class="tabela-painel"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
        }

        const VISOES = {
            professor: (d) => ({
                titulo: `Turmas de ${d.professor.materia}`,
                sub: `${d.professor.nome} · ${d.professor.escola} · semana ${d.semana} · `
                   + `${d.alunos.length} alunos (ordenados por quem estudou menos)`,
                html: tabela([
                    { rotulo: 'Aluno',   campo: 'nome' },
                    { rotulo: 'Turma',   campo: 'turma' },
                    { rotulo: 'Ritmo',   campo: 'status', fmt: badge },
                    { rotulo: 'Minutos', campo: 'minutos' },
                    { rotulo: 'Acerto',  campo: 'taxa_acerto', fmt: pct },
                ], d.alunos),
            }),

            coordenador: (d) => ({
                titulo: `Turmas — ${d.coordenador.escola}`,
                sub: `${d.coordenador.nome} · semana ${d.semana} · média das matérias por turma`,
                html: tabela([
                    { rotulo: 'Turma',   campo: 'turma' },
                    { rotulo: 'Alunos',  campo: 'alunos' },
                    { rotulo: 'Acerto',  campo: 'taxa_acerto', fmt: pct },
                    // soma por matéria: um aluno abaixo da média em 3 matérias conta 3x
                    { rotulo: 'Casos abaixo da média', campo: 'casos_abaixo' },
                ], d.turmas),
            }),

            pai: (d) => ({
                titulo: 'Desempenho dos seus filhos',
                sub: `${d.responsavel.nome} · semana ${d.semana} · média entre as matérias`,
                html: tabela([
                    { rotulo: 'Aluno',   campo: 'nome' },
                    { rotulo: 'Turma',   campo: 'turma' },
                    { rotulo: 'Ritmo',   campo: 'status', fmt: badge },
                    { rotulo: 'Minutos', campo: 'minutos' },
                    { rotulo: 'Acerto',  campo: 'taxa_acerto', fmt: pct },
                ], d.filhos),
            }),
        };

        // Gráficos do painel (rosca de status + barras por turma + evolução).
        // Só professor/coordenador têm `graficos`; para pai, g é undefined e limpa.
        let gStatus = null, gTurma = null, gEvo = null;
        const OPT_BARRA = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: 'rgba(26,43,76,.08)' }, ticks: { color: '#1a2b4c' } },
                y: { grid: { color: 'rgba(26,43,76,.08)' }, ticks: { color: '#1a2b4c' }, beginAtZero: true, suggestedMax: 100 },
            },
        };

        function renderGraficos(g) {
            const box = $('painel-graficos');
            gStatus?.destroy(); gTurma?.destroy(); gEvo?.destroy();
            if (!g) { box.innerHTML = ''; return; }

            box.innerHTML =
                `<div class="graf-linha">
                    <div class="graf-card"><h4>Distribuição por ritmo de estudo</h4><div class="graf-wrap"><canvas id="gf-status"></canvas></div></div>
                    <div class="graf-card"><h4>Acerto médio por turma (%)</h4><div class="graf-wrap"><canvas id="gf-turma"></canvas></div></div>
                 </div>
                 <div class="graf-card"><h4>Evolução do acerto por semana (%)</h4><div class="graf-wrap"><canvas id="gf-evo"></canvas></div></div>`;

            gStatus = new Chart($('gf-status'), {
                type: 'doughnut',
                data: { labels: [STATUS_ROT.bem, STATUS_ROT.atencao, STATUS_ROT.risco], datasets: [{
                    data: [g.status.bem, g.status.atencao, g.status.risco],
                    backgroundColor: [STATUS_COR.bem, STATUS_COR.atencao, STATUS_COR.risco],
                    borderColor: '#fbf6ec', borderWidth: 2,
                }] },
                options: { responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#1a2b4c' } } } },
            });

            gTurma = new Chart($('gf-turma'), {
                type: 'bar',
                data: { labels: g.acerto_turma.map(t => t.turma), datasets: [{
                    data: g.acerto_turma.map(t => Math.round(t.acerto * 100)),
                    backgroundColor: '#2d4ba5', borderRadius: 6,
                }] },
                options: OPT_BARRA,
            });

            gEvo = new Chart($('gf-evo'), {
                type: 'line',
                data: { labels: g.evolucao.map(e => 'Sem ' + e.semana), datasets: [{
                    data: g.evolucao.map(e => Math.round(e.acerto * 100)),
                    borderColor: '#2d4ba5', backgroundColor: 'rgba(45,75,165,.12)',
                    fill: true, tension: .3, pointRadius: 3,
                }] },
                options: OPT_BARRA,
            });
        }

        async function carregarPainel() {
            const titulo = $('painel-titulo');
            const sub    = $('painel-sub');
            const corpo  = $('painel-tabela');

            const falhar = (msg) => { titulo.textContent = msg; sub.textContent = ''; corpo.innerHTML = ''; renderGraficos(null); };

            // Professor + mock: monta local, sem tocar na rede. Coordenador e pai
            // seguem pelo backend nos dois modos — o mock não os alcança.
            if (PAINEL_DEMO && (usuario.role || '').toLowerCase() === 'professor') {
                _turmaAtual = _turmaAtual || turmasDemo()[0]?.turma_id;
                renderPainelDemo();
                return;
            }

            try {
                const r = await apiFetch(`/responsavel/painel?email=${encodeURIComponent(usuario.email)}`);
                const d = await r.json();
                if (!r.ok) return falhar(d.erro || 'Não foi possível carregar o painel.');

                const visao = VISOES[d.role];
                if (!visao) return falhar(`Sem painel para a role "${d.role}".`);

                const v = visao(d);
                titulo.textContent = v.titulo;
                sub.textContent    = v.sub;
                corpo.innerHTML    = v.html;
                renderGraficos(d.graficos);
            } catch (e) {
                console.error('[KaIA] falha ao carregar o painel:', e);
                falhar('Não foi possível conectar ao servidor (a API está rodando em :5000?).');
            }
        }

        // ========================================================
        //   PAINEL DO PROFESSOR — vista TURMA (Fase 4, dados fictícios)
        // ========================================================
        // Recorte primário é a TURMA, não a escola: é o formato que o requisito de
        // LGPD pede (cada professor vê a turma dele). Hoje o backend agrega por
        // escola+matéria — quando conectar, isto vira um filtro por turma_id.
        let _turmaAtual = null;
        let _ordem = { campo: 'minutos', dir: 'asc' };   // quem estudou menos primeiro

        const turmasDemo = () => {
            const m = new Map();
            ALUNOS_DEMO.forEach(a => m.set(a.turma_id, a.turma));
            return [...m].map(([turma_id, turma]) => ({ turma_id, turma }));
        };

        const alunosDaTurma = () => ALUNOS_DEMO
            .filter(a => a.turma_id === _turmaAtual)
            .map(a => ({ ...a, status: statusRitmo(a.minutos) }));

        function renderFiltro() {
            const turmas = turmasDemo();
            $('painel-filtro').innerHTML =
                `<label class="filtro-turma">Turma
                   <select id="sel-turma">${turmas.map(t =>
                     `<option value="${esc(t.turma_id)}">${esc(t.turma)}</option>`).join('')}</select>
                 </label>`;
            $('sel-turma').value = _turmaAtual;
            // Só o conteúdo é re-renderizado: refazer o <select> aqui roubaria o foco.
            $('sel-turma').addEventListener('change', (e) => {
                _turmaAtual = e.target.value;
                renderConteudoTurma();
            });
        }

        // A faixa que responde "quem precisa de mim AGORA" — antes de qualquer
        // tabela. Quem quase não estudou na semana, por ESFORÇO, não por acerto: um
        // aluno que erra muito mas aparece todo dia não é o caso urgente aqui.
        // Sem ninguém na faixa, mensagem calma em vez de espaço vazio.
        function renderRisco(alunos) {
            const risco = alunos.filter(a => a.status === 'risco')
                                .sort((a, b) => a.minutos - b.minutos);
            const box = $('painel-risco');

            if (!risco.length) {
                box.innerHTML =
                    `<div class="risco-vazio">
                       <strong>Todo mundo desta turma estudou nesta semana.</strong>
                       <span>A lista completa continua abaixo, se quiser olhar de perto.</span>
                     </div>`;
                return;
            }

            box.innerHTML =
                `<h3 class="risco-titulo">Precisam de você agora</h3>
                 <div class="risco-lista">${risco.map(a =>
                   `<button type="button" class="risco-card" data-aluno="${esc(a.aluno_id)}">
                      <span class="risco-nome">${esc(a.nome)}</span>
                      <span class="risco-num">${a.minutos} min · ${a.dias} ${a.dias === 1 ? 'dia' : 'dias'} na semana</span>
                      <span class="risco-motivo">${esc(a.motivo || 'menos de 1 h de estudo na semana')}</span>
                    </button>`).join('')}</div>`;

            $$('#painel-risco .risco-card').forEach(b =>
                b.addEventListener('click', () => irParaAluno(b.dataset.aluno)));
        }

        // Só as contagens, em três cards na largura toda. A rosca foi para a fileira
        // de gráficos: ao lado, esticava os cards até a altura dela e sobrava vazio.
        function renderVisao(alunos) {
            const cont = { bem: 0, atencao: 0, risco: 0 };
            alunos.forEach(a => { if (a.status) cont[a.status]++; });

            $('painel-visao').innerHTML =
                `<div class="cards visao-contagens">
                   <div class="card visao-bem"><label>${STATUS_ROT.bem}</label><div class="v">${cont.bem}</div></div>
                   <div class="card visao-atencao"><label>${STATUS_ROT.atencao}</label><div class="v">${cont.atencao}</div></div>
                   <div class="card visao-risco"><label>${STATUS_ROT.risco}</label><div class="v">${cont.risco}</div></div>
                 </div>`;
            return cont;
        }

        // A rosca usa os tokens -bg no preenchimento e os -tx só na borda: com os
        // -tx como fill (como era antes) as três fatias ficavam escuras e pesadas,
        // brigando com os badges suaves da tabela.
        let gStatusDemo = null;
        function desenharRosca(cont) {
            gStatusDemo?.destroy();
            gStatusDemo = new Chart($('gf-status-demo'), {
                type: 'doughnut',
                data: { labels: [STATUS_ROT.bem, STATUS_ROT.atencao, STATUS_ROT.risco], datasets: [{
                    data: [cont.bem, cont.atencao, cont.risco],
                    backgroundColor: [tok('--acerto-bg'), tok('--alerta-bg'), tok('--erro-bg')],
                    borderColor:     [tok('--acerto-tx'), tok('--alerta-tx'), tok('--erro-tx')],
                    borderWidth: 2,
                }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    // Legenda embaixo e numa linha só: o card tem 400px, e com
                    // boxWidth menor + pointStyle os três rótulos cabem sem quebrar
                    // (antes "Em risco" caía para a segunda linha, torto).
                    layout: { padding: { bottom: 4 } },
                    plugins: { legend: {
                        position: 'bottom', align: 'center',
                        labels: { color: tok('--profundo'), usePointStyle: true,
                                  pointStyle: 'circle', boxWidth: 8, boxHeight: 8,
                                  padding: 18, font: { size: 12, weight: '700' } },
                    } },
                },
            });
        }

        // Célula de acerto: barra + número. A barra é decorativa (aria-hidden) —
        // quem lê por leitor de tela recebe o número, que está logo ao lado.
        const celAcerto = (v) =>
            `<span class="metrica-cel">
               <span class="mini-barra" aria-hidden="true">
                 <i style="width:${Math.round(v * 100)}%"></i></span>
               <span class="metrica-num">${pct(v)}</span>
             </span>`;

        // Tabela própria da visão de professor: a tabela() genérica segue intacta
        // para coordenador e pai, que não têm ordenação, mini-barra nem link.
        const COLS_ALUNO = [
            { campo: 'nome',        rotulo: 'Aluno' },
            { campo: 'turma',       rotulo: 'Turma' },
            { campo: 'status',      rotulo: 'Ritmo' },
            { campo: 'minutos',     rotulo: 'Minutos' },
            { campo: 'dias',        rotulo: 'Dias na semana' },
            { campo: 'taxa_acerto', rotulo: 'Acerto' },
        ];

        function ordenarAlunos(linhas) {
            // Ordenar por "ritmo" é ordenar pelos minutos — o badge é só a faixa deles.
            const c = _ordem.campo === 'status' ? 'minutos' : _ordem.campo;
            const s = [...linhas].sort((a, b) => typeof a[c] === 'string'
                ? String(a[c]).localeCompare(String(b[c]), 'pt-BR')
                : a[c] - b[c]);
            return _ordem.dir === 'asc' ? s : s.reverse();
        }

        function renderTabelaAlunos(alunos) {
            const th = COLS_ALUNO.map(c => {
                const ativo = _ordem.campo === c.campo;
                const seta  = ativo ? (_ordem.dir === 'asc' ? '↑' : '↓') : '⇅';
                const aria  = ativo ? (_ordem.dir === 'asc' ? 'ascending' : 'descending') : 'none';
                return `<th aria-sort="${aria}">
                          <button type="button" class="th-ord${ativo ? ' ativo' : ''}" data-campo="${c.campo}">
                            ${c.rotulo}<span class="th-seta" aria-hidden="true">${seta}</span>
                          </button></th>`;
            }).join('');

            const tr = ordenarAlunos(alunos).map(a =>
                `<tr>
                   <td><button type="button" class="aluno-link" data-aluno="${esc(a.aluno_id)}">${esc(a.nome)}</button></td>
                   <td>${esc(a.turma)}</td>
                   <td>${badge(a.status)}</td>
                   <td>${a.minutos}</td>
                   <td>${a.dias}</td>
                   <td>${celAcerto(a.taxa_acerto)}</td>
                 </tr>`).join('');

            $('painel-tabela').innerHTML =
                `<table class="tabela-painel tabela-alunos"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;

            $$('#painel-tabela .th-ord').forEach(b => b.addEventListener('click', () => {
                const campo = b.dataset.campo;
                _ordem = { campo, dir: (_ordem.campo === campo && _ordem.dir === 'asc') ? 'desc' : 'asc' };
                renderTabelaAlunos(alunos);
            }));
            $$('#painel-tabela .aluno-link').forEach(b =>
                b.addEventListener('click', () => irParaAluno(b.dataset.aluno)));
        }

        // Gráficos da turma, separado de renderGraficos() (payload do backend, coordenador/pai).
        // Barras POR ALUNO: com uma turma por vez, "minutos por turma" viraria uma barra só.
        let gAluno = null, gEvoTurma = null;
        function renderGraficosTurma(alunos, cont) {
            gAluno?.destroy(); gEvoTurma?.destroy();
            $('painel-graficos').innerHTML =
                `<div class="graf-linha graf-linha-3">
                   <div class="graf-card"><h4>Distribuição por ritmo de estudo</h4>
                     <div class="graf-wrap"><canvas id="gf-status-demo"></canvas></div></div>
                   <div class="graf-card"><h4>Minutos estudados por aluno</h4>
                     <div class="graf-wrap"><canvas id="gf-aluno"></canvas></div></div>
                   <div class="graf-card"><h4>Acerto médio da turma (%)</h4>
                     <div class="graf-wrap"><canvas id="gf-evo-turma"></canvas></div></div>
                 </div>`;
            desenharRosca(cont);

            const ord = [...alunos].sort((a, b) => a.minutos - b.minutos);
            gAluno = new Chart($('gf-aluno'), {
                type: 'bar',
                data: { labels: ord.map(a => a.nome.split(' ')[0]), datasets: [{
                    data: ord.map(a => a.minutos),
                    // Barra na cor do ritmo: quem estudou pouco se destaca sem
                    // precisar de vermelho de alarme (alerta, não erro).
                    backgroundColor: ord.map(a => tok(`--${a.status === 'bem' ? 'acerto' : 'alerta'}-bg`)),
                    borderColor:     ord.map(a => tok(`--${a.status === 'bem' ? 'acerto' : 'alerta'}-tx`)),
                    borderWidth: 1, borderRadius: 6,
                }] },
                options: EIXOS_LIMPOS,
            });

            // Média da turma ponto a ponto — derivada das séries, sem campo extra
            // no mock. Assume que todos têm a mesma grade de datas (verdade aqui).
            const base = alunos[0]?.serie || [];
            const evo = base.map((p, i) => ({
                dia: p.dia,
                acerto: alunos.reduce((s, a) => s + (a.serie[i]?.acerto ?? 0), 0) / alunos.length,
            }));
            const cvE = $('gf-evo-turma');
            gEvoTurma = new Chart(cvE, {
                type: 'line',
                data: { labels: evo.map(e => e.dia), datasets: [{
                    ...LINHA_BASE, label: 'Acerto médio',
                    data: evo.map(e => Math.round(e.acerto * 100)),
                    borderColor: tok('--azul-coati'),
                    pointBorderColor: tok('--azul-coati'),
                    backgroundColor: degrade('--azul-coati-rgb'),
                }] },
                options: { ...EIXOS_LIMPOS,
                           scales: { ...EIXOS_LIMPOS.scales,
                                     y: { ...EIXOS_LIMPOS.scales.y, suggestedMax: 100 } } },
            });
        }

        function renderConteudoTurma() {
            const alunos = alunosDaTurma();
            const turma  = turmasDemo().find(t => t.turma_id === _turmaAtual);
            $('painel-sub').textContent =
                `${PROFESSOR_DEMO.nome} · ${PROFESSOR_DEMO.escola} · semana ${SEMANA_DEMO} · `
                + `${alunos.length} alunos em ${turma?.turma ?? '—'}`;
            $('voltar-turma-rot').textContent = turma?.turma ?? 'a turma';
            renderRisco(alunos);
            const cont = renderVisao(alunos);
            renderGraficosTurma(alunos, cont);
            renderTabelaAlunos(alunos);
        }

        function renderPainelDemo() {
            $('painel-titulo').textContent = `Turmas de ${PROFESSOR_DEMO.materia}`;
            renderFiltro();
            renderConteudoTurma();
        }

        // ========================================================
        //   NAVEGAÇÃO turma ↔ aluno (hash, sem abas)
        // ========================================================
        // O hash existe para o Voltar do NAVEGADOR funcionar: sem ele, voltar sairia
        // da tela inteira em vez de devolver o professor à lista.
        let _veioDaLista = false;

        function mostrarVista(qual) {
            $('vista-turma').hidden = qual !== 'turma';
            $('vista-aluno').hidden = qual !== 'aluno';
            window.scrollTo(0, 0);
        }

        function irParaAluno(id) {
            _veioDaLista = true;
            location.hash = 'aluno=' + encodeURIComponent(id);
        }

        function abrirRelatorio(aluno) {
            // Trocar a vista ANTES de desenhar: com a seção ainda `hidden` o canvas
            // mede 0×0 e o Chart.js congela esse tamanho — os gráficos saíam
            // esticados e cortados.
            mostrarVista('aluno');
            preencherRelatorio({
                nome: aluno.nome,
                sub: `${aluno.turma} · semana ${SEMANA_DEMO} · ${aluno.minutos} min em `
                   + `${aluno.dias} ${aluno.dias === 1 ? 'dia' : 'dias'}`,
                status: statusRitmo(aluno.minutos),
                hobbies: aluno.hobbies || [],
                resumo: aluno.resumo,
                serie: aluno.serie,
            });
        }

        function aplicarHash() {
            const m = location.hash.match(/^#aluno=(.+)$/);
            if (!m) return mostrarVista('turma');
            const aluno = ALUNOS_DEMO.find(a => a.aluno_id === decodeURIComponent(m[1]));
            // Hash inválido (link velho, id que não existe) não pode deixar a tela em
            // branco — cai na lista.
            if (!aluno) return mostrarVista('turma');
            abrirRelatorio(aluno);
        }

        window.addEventListener('hashchange', aplicarHash);
        $('voltar-turma').addEventListener('click', () => {
            if (_veioDaLista) { history.back(); return; }   // devolve a entrada do histórico
            history.replaceState(null, '', location.pathname);
            mostrarVista('turma');
        });

        document.getElementById('email').addEventListener('keydown', e => {
            if (e.key === 'Enter') carregar();
        });

        // Só o professor com mock roda offline. Escondir a busca para TODOS tiraria
        // de coordenador e pai a única forma que eles têm de abrir um aluno — eles
        // não têm nome clicável, porque o payload do backend não traz aluno_id.
        const usandoMock = () => PAINEL_DEMO && (usuario.role || '').toLowerCase() === 'professor';

        document.addEventListener('DOMContentLoaded', () => {
            if (usandoMock()) {
                // Os dois dependem de rede e, num painel mock, só confundem. E a busca
                // por e-mail é o caminho SEM escopo fino (dívida em app.py) — com o
                // clique no nome levando ao mesmo relatório, ela vira supérflua aqui.
                $('bloco-busca').hidden = true;
                $('bloco-hobbies').hidden = true;
            } else {
                carregarGraficoHobbies();
            }
            carregarPainel();
            aplicarHash();          // respeita #aluno=... vindo direto na URL
        });
    </script>

</body>

</html>
