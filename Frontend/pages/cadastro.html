<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaIA | Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
</head>

<body>

    <!-- Preloader de entrada — ver comentário equivalente em login.html. -->
    <div id="kaia-preloader" aria-hidden="true">
        <div class="kaia-pre-saudacoes">
            <!-- A MESMA esfera da espera da IA (.kaia-ail__esfera): reaproveitada
                 aqui em variante clara, via .kaia-pre-esfera no style.css. É só
                 CSS — sem React, porque esta tela precisa aparecer no primeiro
                 paint e não carrega a ilha do ai-loader.js. -->
            <div class="kaia-pre-esfera kaia-ail__esfera"></div>
            <p class="kaia-pre-item">Olá</p>
            <p class="kaia-pre-item" lang="ja">こんにちは</p>
            <p class="kaia-pre-item">Hello</p>
            <p class="kaia-pre-item">Hola</p>
            <p class="kaia-pre-item" lang="ar" dir="rtl">مرحبا</p>
            <p class="kaia-pre-item">Bonjour</p>
            <p class="kaia-pre-item">Ciao</p>
            <p class="kaia-pre-item" lang="ru">Привет</p>
            <p class="kaia-pre-item">Hallo</p>
            <p class="kaia-pre-item">Namaste</p>
        </div>
    </div>

    <div class="tela-login">
        <!-- A luz foge do mouse e fica ATRÁS da caixa (ver registrarLuz no script.js) -->
        <div class="luz-fundo" id="luzFundo"></div>

        <form class="caixa-login" onsubmit="criarConta(event)" novalidate>
            <h1>Ka<span>IA</span></h1>
            <p>Crie sua conta e comece a focar.</p>

            <div class="grupo-input">
                <label for="cad-nome">Nome</label>
                <input id="cad-nome" type="text" placeholder="Seu nome" autocomplete="name">
            </div>

            <div class="grupo-input">
                <label for="cad-email">Email</label>
                <input id="cad-email" type="email" placeholder="Digite seu email" autocomplete="email">
            </div>

            <div class="grupo-input">
                <label for="cad-senha">Senha</label>
                <input id="cad-senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <div class="grupo-termos">
                <input id="cad-termos" type="checkbox">
                <label for="cad-termos">Li e aceito os
                    <a href="termos.html" target="_blank" rel="noopener">termos de uso</a> e a
                    <a href="privacidade.html" target="_blank" rel="noopener">política de privacidade</a>.</label>
            </div>

            <!-- Preenchidos por criarConta() -->
            <p id="cad-erro" class="erro-login" role="alert" aria-live="polite"></p>
            <p id="cad-ok" class="erro-login" role="status" aria-live="polite" style="color: var(--acerto-tx, #2f5d3a);"></p>

            <button type="submit" class="botao-login">Criar conta</button>
            <a href="login.html" class="link-secundario">Já tem conta? Entrar</a>
        </form>
    </div>

    <script src="../js/comum.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
