<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaIA | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
</head>

<body>

    <!-- Preloader no HTML (não via JS) para estar no 1º paint, sem piscar o login.
         Sai pela animação; registrarPreloader (login.js) garante a remoção e deixa
         pular com clique ou tecla. -->
    <div id="kaia-preloader" aria-hidden="true">
        <div class="kaia-pre-saudacoes">
            <!-- Mesma esfera da espera da IA (.kaia-ail__esfera), variante clara via
                 .kaia-pre-esfera. Só CSS, sem React: precisa do 1º paint e esta tela
                 não carrega o ai-loader.js. -->
            <div class="kaia-pre-esfera kaia-ail__esfera"></div>
            <p class="kaia-pre-item">Olá</p>
            <p class="kaia-pre-item" lang="ja">こんにちは</p>
            <p class="kaia-pre-item">Hello</p>
            <p class="kaia-pre-item">Hola</p>
            <p class="kaia-pre-item" lang="ar" dir="rtl">مرحبا</p>
            <p class="kaia-pre-item">Bonjour</p>
            <p class="kaia-pre-item">Ciao</p>
            <p class="kaia-pre-item" lang="ru">Привет</p>
            <p class="kaia-pre-item">Hallo</p>
            <p class="kaia-pre-item">Namaste</p>
        </div>
    </div>

    <div class="tela-login">
        <!-- A luz foge do mouse e fica ATRÁS da caixa (ver registrarLuz no login.js) -->
        <div class="luz-fundo" id="luzFundo"></div>

        <form class="caixa-login" onsubmit="salvarLogin(event)">
            <h1>Ka<span>IA</span></h1>
            <p>Inicie sua missão de foco.</p>

            <div class="grupo-input">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" placeholder="Digite seu email" autocomplete="email">
            </div>

            <div class="grupo-input">
                <label for="login-senha">Senha</label>
                <!-- O olho é NOSSO, não o do navegador: o do Edge some quando o campo
                     perde o foco e não volta para aquele valor (ver .campo-senha). -->
                <div class="campo-senha">
                    <input id="login-senha" type="password" placeholder="Digite sua senha" autocomplete="current-password">
                    <button type="button" class="olho-senha" aria-label="Mostrar senha" aria-pressed="false" hidden>
                        <svg class="olho-aberto" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="olho-fechado" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9"/><path d="M9.9 5.2A9.3 9.3 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <!-- Reusa .grupo-termos (mesmo padrão do aceite no cadastro). Começa
                 DESMARCADO de propósito: computador de escola é compartilhado. -->
            <div class="grupo-termos">
                <input id="login-lembrar" type="checkbox">
                <label for="login-lembrar">Lembre de mim neste computador</label>
            </div>

            <!-- Preenchido por salvarLogin() quando o e-mail não é encontrado -->
            <p id="login-erro" class="erro-login" role="alert" aria-live="polite"></p>

            <button type="submit" class="botao-login">Entrar</button>
            <a href="cadastro.html" class="link-secundario">Ainda não tem conta? Cadastre-se</a>
            <span class="link-secundario">Esqueci a senha</span>
        </form>
    </div>

    <script src="../js/comum.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
